

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROYAL STORE | فروشگاه لوکس</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,Arial,sans-serif;background:#0b0b0b;color:#fff;line-height:1.8}
header{background:#111;border-bottom:1px solid #b89543;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:25px;font-weight:bold;color:#d8b45a}
header button,.btn{background:#d8b45a;color:#111;border:0;padding:10px 17px;border-radius:8px;font-weight:bold;cursor:pointer}
.hero{text-align:center;padding:65px 15px;background:linear-gradient(135deg,#191919,#30240d)}
.hero h1{font-size:35px;color:#e4c36d;margin-bottom:12px}
.hero p{color:#ddd;margin-bottom:20px}
.container{max-width:1150px;margin:auto;padding:30px 16px}
.search{width:100%;padding:14px;border:1px solid #b89543;border-radius:9px;background:#171717;color:white;margin-bottom:18px;font-size:16px}
.categories{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:25px}
.categories button{background:#202020;color:#e5c36a;border:1px solid #8e7136;padding:9px 15px;border-radius:20px;cursor:pointer}
.categories button.active{background:#d8b45a;color:#111}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:#171717;border:1px solid #393027;border-radius:13px;overflow:hidden;transition:.25s}
.card:hover{transform:translateY(-5px);border-color:#d8b45a}
.card img{width:100%;height:210px;object-fit:cover;background:#222}
.card-content{padding:15px}
.card h3{color:#e4c36d;margin-bottom:5px}
.card p{font-size:13px;color:#bbb;min-height:45px}
.price{color:#e4c36d;font-weight:bold;margin:12px 0}
.actions{display:flex;gap:8px}
.actions button{flex:1;padding:9px 5px;border:0;border-radius:7px;cursor:pointer;font-weight:bold}
.add{background:#d8b45a;color:#111}
.details{background:#333;color:white}
.section-title{text-align:center;color:#e4c36d;font-size:25px;margin-bottom:25px}
.panel{background:#171717;border:1px solid #514127;border-radius:12px;padding:20px;margin-top:35px}
.cart-item{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #333;padding:12px 0}
.remove{background:#8c2929;color:white;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}
footer{text-align:center;background:#111;padding:30px 15px;margin-top:40px;border-top:1px solid #b89543;color:#bbb}
footer h2{color:#d8b45a}
.modal{display:none;position:fixed;inset:0;background:#000c;z-index:10;align-items:center;justify-content:center;padding:15px}
.modal-box{background:#181818;border:1px solid #d8b45a;border-radius:12px;padding:20px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
.modal-box img{width:100%;height:220px;object-fit:cover;border-radius:8px}
.close{float:left;background:#8c2929;color:white;border:0;padding:6px 12px;border-radius:6px;cursor:pointer}
.empty{text-align:center;color:#aaa;padding:20px}
@media(max-width:600px){.hero h1{font-size:27px}header{justify-content:center}.card img{height:190px}}
</style>
</head>
<body>

<header>
  <div class="logo">ROYAL STORE</div>
  <button onclick="scrollToCart()">🛒 سبد خرید (<span id="cartCount">0</span>)</button>
</header>

<section class="hero">
  <h1>به فروشگاه رویال خوش آمدید</h1>
  <p>تجربه خرید محصولات خاص و لوکس</p>
  <button class="btn" onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">مشاهده محصولات</button>
</section>

<main class="container" id="shop">
  <h2 class="section-title">محصولات فروشگاه</h2>
  <input class="search" id="search" type="search" placeholder="جست‌وجوی محصول..." oninput="renderProducts()">

  <div class="categories" id="categories">
    <button class="active" onclick="setCategory('همه',this)">همه محصولات</button>
    <button onclick="setCategory('پوشاک',this)">پوشاک</button>
    <button onclick="setCategory('دیجیتال',this)">دیجیتال</button>
    <button onclick="setCategory('اکسسوری',this)">اکسسوری</button>
    <button onclick="setCategory('خانه',this)">خانه</button>
  </div>

  <div class="products" id="products"></div>

  <section class="panel" id="cart">
    <h2 class="section-title">سبد خرید شما 🛒</h2>
    <div id="cartItems"><p class="empty">سبد خرید خالی است.</p></div>
    <h3 id="total" class="price">مجموع: ۰ تومان</h3>
    <button class="btn" onclick="checkout()">ثبت سفارش در واتساپ</button>
  </section>
</main>

<footer>
  <h2>ROYAL STORE</h2>
  <p>فروشگاه آنلاین محصولات خاص و لوکس</p>
  <p>برای سفارش و ارتباط با ما از واتساپ استفاده کنید.</p>
  <p>© تمامی حقوق محفوظ است.</p>
</footer>

<div class="modal" id="productModal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <button class="close" onclick="closeModal()">بستن ✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const items = [
{id:1,name:"ساعت کلاسیک",category:"اکسسوری",price:2500000,img:"images/watch.jpg",desc:"ساعت شیک و کلاسیک با طراحی لوکس و جذاب."},
{id:2,name:"هدفون بی‌سیم",category:"دیجیتال",price:1200000,img:"images/headphones.jpg",desc:"هدفون بی‌سیم با طراحی مدرن و کیفیت صدای مناسب."},
{id:3,name:"کفش اسپرت",category:"پوشاک",price:1900000,img:"images/sneakers.jpg",desc:"کفش اسپرت با طراحی زیبا و مناسب استفاده روزمره."},
{id:4,name:"کیف دستی",category:"اکسسوری",price:1450000,img:"images/handbag.jpg",desc:"کیف دستی شیک با طراحی خاص و ظاهری جذاب."},
{id:5,name:"دوربین عکاسی",category:"دیجیتال",price:8500000,img:"images/camera.jpg",desc:"دوربین عکاسی برای ثبت لحظه‌های خاطره‌انگیز."},
{id:6,name:"عینک آفتابی",category:"اکسسوری",price:850000,img:"images/sunglasses.jpg",desc:"عینک آفتابی با طراحی مدرن و زیبا."},
{id:7,name:"عطر لوکس",category:"اکسسوری",price:1100000,img:"images/perfume.jpg",desc:"عطری خاص و خوش‌بو برای سلیقه‌های متفاوت."},
{id:8,name:"چراغ دکوراتیو",category:"خانه",price:650000,img:"images/lamp.jpg",desc:"چراغ دکوراتیو زیبا برای جذاب‌تر کردن فضای خانه."}
];

let cart=[];
let currentCategory="همه";

function money(n){
 return new Intl.NumberFormat("fa-IR").format(n)+" تومان";
}

function renderProducts(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 const filtered=items.filter(p=>
  (currentCategory==="همه"||p.category===currentCategory)&&
  (p.name.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q))
 );
 const area=document.getElementById("products");
 if(!filtered.length){
  area.innerHTML='<p class="empty">محصولی پیدا نشد.</p>';
  return;
 }
 area.innerHTML=filtered.map(p=>`
 <article class="card">
  <img src="${p.img}" alt="${p.name}" onerror="this.onerror=null;this.src='https://placehold.co/500x350/171717/d8b45a?text=ROYAL+STORE'">
  <div class="card-content">
   <h3>${p.name}</h3>
   <p>${p.desc}</p>
   <div class="price">${money(p.price)}</div>
   <div class="actions">
    <button class="add" onclick="addToCart(${p.id})">افزودن به سبد</button>
    <button class="details" onclick="showDetails(${p.id})">جزئیات</button>
   </div>
  </div>
 </article>`).join("");
}

function setCategory(cat,btn){
 currentCategory=cat;
 document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 renderProducts();
}

function addToCart(id){
 const found=cart.find(x=>x.id===id);
 if(found)found.qty++;
 else cart.push({id,qty:1});
 renderCart();
}

function removeFromCart(id){
 cart=cart.filter(x=>x.id!==id);
 renderCart();
}

function renderCart(){
 const area=document.getElementById("cartItems");
 let count=cart.reduce((s,x)=>s+x.qty,0);
 document.getElementById("cartCount").textContent=new Intl.NumberFormat("fa-IR").format(count);
 let total=0;
 if(!cart.length){
  area.innerHTML='<p class="empty">سبد خرید خالی است.</p>';
 }else{
  area.innerHTML=cart.map(x=>{
   const p=items.find(y=>y.id===x.id);
   total+=p.price*x.qty;
   return `<div class="cart-item">
    <span>${p.name} × ${new Intl.NumberFormat("fa-IR").format(x.qty)}</span>
    <span>${money(p.price*x.qty)}</span>
    <button class="remove" onclick="removeFromCart(${p.id})">حذف</button>
   </div>`;
  }).join("");
 }
 document.getElementById("total").textContent="مجموع: "+money(total);
}

function scrollToCart(){
 document.getElementById("cart").scrollIntoView({behavior:"smooth"});
}

function showDetails(id){
 const p=items.find(x=>x.id===id);
 document.getElementById("modalContent").innerHTML=`
 <img src="${p.img}" alt="${p.name}">
 <h2 style="color:#e4c36d;margin-top:12px">${p.name}</h2>
 <p>${p.desc}</p>
 <p class="price">${money(p.price)}</p>
 <button class="btn" onclick="addToCart(${p.id});closeModal()">افزودن به سبد خرید</button>`;
 document.getElementById("productModal").style.display="flex";
}

function closeModal(){
 document.getElementById("productModal").style.display="none";
}

function checkout(){
 if(!cart.length){
  alert("سبد خرید شما خالی است.");
  return;
 }
 let message="سلام، برای خرید این محصولات سفارش دارم:%0A";
 let total=0;
 cart.forEach(x=>{
  const p=items.find(y=>y.id===x.id);
  total+=p.price*x.qty;
  message+=`%0A${encodeURIComponent(p.name)} - تعداد ${x.qty} - ${encodeURIComponent(money(p.price*x.qty))}`;
 });
 message+=`%0Aمجموع: ${encodeURIComponent(money(total))}`;
 // شماره واتساپ فروشگاه را بعداً در این قسمت وارد می‌کنیم.
 const phone="989XXXXXXXXX";
 if(phone==="989XXXXXXXXX"){
  alert("برای فعال شدن سفارش واتساپی، باید شماره واتساپ فروشگاه را در کد وارد کنیم.");
  return;
 }
 window.open("https://wa.me/"+phone+"?text="+message,"_blank");
}

renderProducts();
renderCart();
</script>
</body>
</html>
